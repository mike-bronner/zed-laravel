name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build assets for'
        required: true

env:
  GITHUB_TOKEN: ${{ secrets.ZED_PUBLISHING_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  update-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.extract_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ env.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version from release tag
        id: extract_version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Get tag from release event or workflow dispatch input
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          # Remove 'v' prefix if present (e.g., v1.2.3 -> 1.2.3)
          VERSION="${TAG#v}"
          # Fail fast unless VERSION is a strict semver (with optional
          # pre-release suffix). Every downstream consumer — the three sed
          # version substitutions, the commit message, and the tag/release
          # curl calls — uses this value or the tag it derives from, so this
          # single guard keeps sed metacharacters (/, &, \) and anything else
          # surprising out of all of them.
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $SEMVER_RE ]]; then
            # Strip CR/LF before interpolating the (unvalidated) values into
            # the workflow command, so a newline in a workflow_dispatch tag
            # input can't split the ::error:: annotation and forge an
            # additional workflow command.
            SAFE_TAG="${TAG//[$'\n\r']/ }"
            SAFE_VERSION="${VERSION//[$'\n\r']/ }"
            echo "::error::Tag '${SAFE_TAG}' does not yield a valid semver version (got '${SAFE_VERSION}')"
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # Past the guard, TAG is structurally either VERSION or v${VERSION}
          # (the '#v' strip removes at most one leading 'v'), so this output is
          # guard-validated too. Downstream steps consume it instead of the raw
          # event value, making their injection-safety independent of step
          # ordering (defense-in-depth follow-up from #243 / PR #261 → #262).
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Extracted version: ${VERSION}"

      - name: Update versions and lock files
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # Update root Cargo.toml
          sed -i 's/^version = "[^"]*"/version = "'"$VERSION"'"/' Cargo.toml
          echo "Updated root Cargo.toml version to $VERSION"

          # Update extension.toml
          sed -i 's/^version = "[^"]*"/version = "'"$VERSION"'"/' extension.toml
          echo "Updated extension.toml version to $VERSION"

          # Update laravel-lsp/Cargo.toml
          sed -i 's/^version = "[^"]*"/version = "'"$VERSION"'"/' laravel-lsp/Cargo.toml
          echo "Updated laravel-lsp/Cargo.toml version to $VERSION"

          # Update Cargo.lock files
          cargo update --manifest-path Cargo.toml
          echo "Updated root Cargo.lock"

          cargo update --manifest-path laravel-lsp/Cargo.toml
          echo "Updated laravel-lsp/Cargo.lock"

      - name: Verify changes
        run: |
          echo "=== Root Cargo.toml ==="
          grep "^version =" Cargo.toml
          echo "=== extension.toml ==="
          grep "^version =" extension.toml
          echo "=== laravel-lsp/Cargo.toml ==="
          grep "^version =" laravel-lsp/Cargo.toml

      - name: Commit and push changes
        id: commit_changes
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_SSH_KEY }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          # Commit as the token owner (not github-actions[bot]) and SSH-sign so the
          # version-bump commit is "Verified" and satisfies the signed-commits rule
          # on main without relying on the admin bypass.
          GIT_USER_LOGIN=$(gh api user --jq .login)
          GIT_USER_ID=$(gh api user --jq .id)
          GIT_USER_NAME=$(gh api user --jq '.name // .login')
          git config --local user.name "${GIT_USER_NAME}"
          git config --local user.email "${GIT_USER_ID}+${GIT_USER_LOGIN}@users.noreply.github.com"

          if [ -n "${SIGNING_KEY:-}" ]; then
            SSH_KEY_FILE="$(mktemp)"
            printf '%s\n' "${SIGNING_KEY}" > "${SSH_KEY_FILE}"
            chmod 600 "${SSH_KEY_FILE}"
            git config --local gpg.format ssh
            git config --local user.signingkey "${SSH_KEY_FILE}"
            git config --local commit.gpgsign true
            echo "SSH commit signing enabled"
          else
            echo "::warning::COMMIT_SIGNING_SSH_KEY not set — version-bump commit will be unsigned"
          fi

          # Check if there are any changes to commit
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            echo "new_commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          else
            git add -A
            git commit -m "chore: update version to ${VERSION}"
            git push origin main
            NEW_COMMIT_SHA=$(git rev-parse HEAD)
            echo "new_commit_sha=${NEW_COMMIT_SHA}" >> $GITHUB_OUTPUT
            echo "All changed files updated and pushed to main branch"
            echo "New commit SHA: ${NEW_COMMIT_SHA}"
          fi

      - name: Update tag and release
        if: github.event_name == 'release' && steps.commit_changes.outputs.new_commit_sha != ''
        env:
          # Consume the guard-validated tag (safe-by-construction) rather than
          # the raw event value (safe only by same-job step ordering). On a
          # release event both hold the same string, but this keeps the curl
          # URL/JSON interpolations hardened even if steps get reordered or
          # split across jobs. Closes the residual follow-up from Holmes's
          # review of #243 (PR #261): #262.
          TAG_NAME: ${{ steps.extract_version.outputs.tag }}
        run: |
          RELEASE_ID="${{ github.event.release.id }}"
          FINAL_COMMIT_SHA="${{ steps.commit_changes.outputs.new_commit_sha }}"

          echo "Updating tag ${TAG_NAME} to point to commit ${FINAL_COMMIT_SHA}"

          # Update the tag to point to the new commit
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/${TAG_NAME}" \
            -d "{\"sha\":\"${FINAL_COMMIT_SHA}\",\"force\":true}"

          echo "Updated tag ${TAG_NAME} to commit ${FINAL_COMMIT_SHA}"

          # Update the release to point to the new commit
          curl -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -d "{\"tag_name\":\"${TAG_NAME}\",\"target_commitish\":\"${FINAL_COMMIT_SHA}\"}"

          echo "Updated release ${RELEASE_ID} to point to commit ${FINAL_COMMIT_SHA}"
          echo "Version update complete!"

  build-lsp:
    name: Build LSP Server
    needs: update-version
    runs-on: ${{ matrix.os }}
    strategy:
      # One target's flaky toolchain download must not cancel the artifacts that
      # already built. Each job uploads an independent release asset, so a single
      # failure should fail only itself.
      fail-fast: false
      matrix:
        include:
          # The Linux assets are statically-linked musl builds: one binary per
          # arch runs on glibc distros, Alpine, and NixOS alike (the same
          # approach Zed uses for its own remote server). No separate gnu builds.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: laravel-ce-lsp-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: laravel-ce-lsp-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: laravel-ce-lsp-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: laravel-ce-lsp-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: laravel-ce-lsp-windows-x64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: laravel-ce-lsp-windows-arm64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Both Linux targets (musl x64/arm64) cross-compile through
      # cargo-zigbuild. Zig bundles the cross-linker and a C compiler — the cc
      # crate (build.rs compiles the tree-sitter C grammar) and the Rust linker
      # both use it — so no apt cross-toolchains, no ~/.cargo linker hacks, and
      # no downloads from single-maintainer mirrors like musl.cc.
      - name: Set up Zig (Linux cross-compilation)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild (Linux cross-compilation)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2.87.6
        with:
          tool: cargo-zigbuild

      - name: Build LSP Server
        shell: bash
        run: |
          cd laravel-lsp
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # The source name is the Cargo package's binary (`laravel-lsp`), which
      # stays as-is so the local dev path in `.zed/settings.json` keeps
      # working. The destination is the published asset name
      # (`laravel-ce-lsp-*`), which `src/lib.rs::platform_binary_name` expects
      # to find inside the archive after extraction — the two must agree.
      - name: Prepare binary
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp laravel-lsp/target/${{ matrix.target }}/release/laravel-lsp.exe ${{ matrix.binary_name }}
          else
            cp laravel-lsp/target/${{ matrix.target }}/release/laravel-lsp ${{ matrix.binary_name }}
          fi

      - name: Create archive
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ${{ matrix.binary_name }}.zip ${{ matrix.binary_name }}
            echo "ASSET_PATH=${{ matrix.binary_name }}.zip" >> $GITHUB_ENV
          else
            tar -czf ${{ matrix.binary_name }}.tar.gz ${{ matrix.binary_name }}
            echo "ASSET_PATH=${{ matrix.binary_name }}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: ${{ env.ASSET_PATH }}
          token: ${{ env.GITHUB_TOKEN }}

  publish:
    name: Publish Zed Extension
    runs-on: ubuntu-latest
    needs:
      - update-version
      - build-lsp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Publish to zed-industries/extensions
        uses: ./.github/actions/publish-zed-extension
        with:
          extension-name: laravel
          version: ${{ needs.update-version.outputs.new_version }}
          push-to: mike-bronner/extensions
          committer-token: ${{ secrets.ZED_PUBLISHING_TOKEN }}
          signing-key: ${{ secrets.COMMIT_SIGNING_SSH_KEY }}
